kind = "web"
previewPath = "/"
title = "LOVELOCK"
description = "A social quiz platform for creating personal challenges, sharing unique quiz links, and seeing real participant responses."
version = "1.0.0"
id = "artifacts/lovelock"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20784

[services.development]
run = "pnpm --filter @workspace/lovelock run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lovelock", "run", "build" ]
serve = "static"
publicDir = "artifacts/lovelock/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20784"
BASE_PATH = "/"
